name: Scrape FunPay Sold Accounts Tracker

on:
  schedule:
    # Jalan setiap hari pukul 23:50 UTC
    - cron: "50 23 * * *"
  workflow_dispatch: {}  # Memungkinkan trigger manual dari tab Actions

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps chromium

      - name: Run tracker script
        run: |
          python tracker.py

      - name: Commit and push updated CSV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add active_listings.csv
          if [ -f sold_accounts.csv ]; then git add sold_accounts.csv; fi
          git diff --cached --quiet && echo "Tidak ada perubahan data." || git commit -m "chore: update data tracking FunPay [auto]"
          git push

