name: Scrape FunPay Sold Accounts Tracker

on:
  schedule:
    # Jalan otomatis setiap 2 jam (menit ke-17)
    - cron: "17 */2 * * *"
  workflow_dispatch: {}  # Memungkinkan trigger manual dari tab Actions

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps chromium

      - name: Run tracker script
        run: |
          python tracker.py

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          path: |
            debug_page.html
            debug_screenshot.png
          if-no-files-found: ignore

      - name: Commit and push updated CSV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Menambahkan seluruh file .csv (active_listings.csv dan semua sold_accounts bulanan)
          git add *.csv
          
          git diff --cached --quiet && echo "Tidak ada perubahan data." || git commit -m "chore: update data tracking FunPay [auto]"
          git push
